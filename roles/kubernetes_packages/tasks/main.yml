---
- name: Assert Kubernetes packages role is enabled
  ansible.builtin.assert:
    that:
      - kubernetes_packages_enabled | bool
    fail_msg: >-
      The kubernetes_packages role is disabled. Set
      kubernetes_packages_enabled=true to run it.
    success_msg: "Kubernetes packages role is enabled."
  tags:
    - kubernetes
    - packages

- name: Assert Kubernetes minor version is defined
  ansible.builtin.assert:
    that:
      - k8s_minor is defined
      - k8s_minor | string | length > 0
    fail_msg: "k8s_minor must be defined, for example k8s_minor: \"1.36\"."
    success_msg: "k8s_minor is defined."
  tags:
    - kubernetes
    - packages

- name: Set Kubernetes apt repository facts
  ansible.builtin.set_fact:
    kubernetes_apt_release_key_url: >-
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key
    kubernetes_apt_repository: >-
      deb [signed-by={{ kubernetes_apt_keyring_path }}]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
    kubernetes_package_exact_version: >-
      {%- if k8s_version is defined and k8s_version | string | length > 0 -%}
      {%- if '-' in (k8s_version | string) -%}
      {{ k8s_version }}
      {%- else -%}
      {{ k8s_version }}{{ kubernetes_package_version_suffix }}
      {%- endif -%}
      {%- else -%}
      {{ '' }}
      {%- endif -%}
  tags:
    - kubernetes
    - packages

- name: Create apt keyring directory
  ansible.builtin.file:
    path: "{{ kubernetes_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - kubernetes
    - packages

- name: Download Kubernetes apt release key
  ansible.builtin.get_url:
    url: "{{ kubernetes_apt_release_key_url }}"
    dest: "{{ kubernetes_apt_release_key_path }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - kubernetes
    - packages

- name: Dearmor Kubernetes apt release key
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor -o {{ kubernetes_apt_keyring_path }}
      {{ kubernetes_apt_release_key_path }}
    creates: "{{ kubernetes_apt_keyring_path }}"
  tags:
    - kubernetes
    - packages

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "{{ kubernetes_apt_repository }}"
    filename: "{{ kubernetes_apt_repository_file }}"
    state: present
    update_cache: false
  tags:
    - kubernetes
    - packages

- name: Update apt cache after Kubernetes repository setup
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  tags:
    - kubernetes
    - packages

- name: Install latest Kubernetes packages from configured minor repository
  ansible.builtin.apt:
    name: "{{ kubernetes_packages_names }}"
    state: present
    allow_change_held_packages: true
  when: kubernetes_package_exact_version | string | length == 0
  tags:
    - kubernetes
    - packages

- name: Install exact Kubernetes package versions
  ansible.builtin.apt:
    name: >-
      {{
        kubernetes_packages_names
        | map('regex_replace', '$', '=' ~ kubernetes_package_exact_version)
        | list
      }}
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
  when: kubernetes_package_exact_version | string | length > 0
  tags:
    - kubernetes
    - packages

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages_names }}"
  when: kubernetes_packages_hold | bool
  tags:
    - kubernetes
    - packages

- name: Unhold Kubernetes packages when requested
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ kubernetes_packages_names }}"
  when: not kubernetes_packages_hold | bool
  tags:
    - kubernetes
    - packages

- name: Enable kubelet service
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
  tags:
    - kubernetes
    - packages

- name: Validate kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version
  changed_when: false
  register: kubernetes_packages_kubeadm_version
  tags:
    - kubernetes
    - packages

- name: Validate kubelet version
  ansible.builtin.command:
    cmd: kubelet --version
  changed_when: false
  register: kubernetes_packages_kubelet_version
  tags:
    - kubernetes
    - packages

- name: Validate kubectl client version
  ansible.builtin.command:
    cmd: kubectl version --client=true
  changed_when: false
  register: kubernetes_packages_kubectl_version
  tags:
    - kubernetes
    - packages
