---
- name: Assert containerd role is enabled
  ansible.builtin.assert:
    that:
      - containerd_enabled | bool
    fail_msg: >-
      The containerd role is disabled. Set containerd_enabled=true to run it.
    success_msg: "containerd role is enabled."
  tags:
    - containerd

- name: Assert supported containerd install source
  ansible.builtin.assert:
    that:
      - containerd_install_source == 'os'
    fail_msg: >-
      containerd_install_source={{ containerd_install_source }} is not
      implemented yet. Use containerd_install_source=os.
    success_msg: "containerd will be installed from the OS package manager."
  tags:
    - containerd

- name: Install containerd from OS package manager
  ansible.builtin.apt:
    name: "{{ containerd_package_name }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - containerd

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: "{{ containerd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - containerd

- name: Check containerd configuration file
  ansible.builtin.stat:
    path: "{{ containerd_config_file }}"
  register: containerd_config_stat
  tags:
    - containerd

- name: Generate default containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
  register: containerd_default_config
  changed_when: false
  failed_when: containerd_default_config.rc != 0
  when: not containerd_config_stat.stat.exists
  tags:
    - containerd

- name: Write default containerd configuration when missing
  ansible.builtin.copy:
    dest: "{{ containerd_config_file }}"
    content: "{{ containerd_default_config.stdout }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd
  when: not containerd_config_stat.stat.exists
  tags:
    - containerd

- name: Read containerd configuration
  ansible.builtin.slurp:
    path: "{{ containerd_config_file }}"
  register: containerd_config_content
  tags:
    - containerd

- name: Assert containerd runc options section exists
  ansible.builtin.assert:
    that:
      - >-
        containerd_config_content.content
        | b64decode
        | regex_search(
          '(?m)^\s*\[plugins\."io.containerd.grpc.v1.cri"\.containerd\.runtimes\.runc\.options\]'
        )
        is not none
    fail_msg: >-
      {{ containerd_config_file }} does not contain the standard containerd
      runc options section needed to set SystemdCgroup. Review the config or
      remove it so this role can generate a default config.
    success_msg: "containerd runc options section is present."
  tags:
    - containerd

- name: Configure containerd to use systemd cgroups
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_file }}"
    regexp: '^\s*SystemdCgroup\s*='
    line: '            SystemdCgroup = true'
    insertafter: >-
      ^\s*\[plugins\."io.containerd.grpc.v1.cri"\.containerd\.runtimes\.runc\.options\]$
  notify: Restart containerd
  tags:
    - containerd

- name: Configure containerd pause image override
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_file }}"
    regexp: '^(\s*)sandbox_image = .*$'
    line: '\1sandbox_image = "{{ containerd_pause_image }}"'
    backrefs: true
  notify: Restart containerd
  when: containerd_pause_image | string | length > 0
  tags:
    - containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ containerd_service_name }}"
    enabled: true
    state: started
  tags:
    - containerd

- name: Apply pending containerd restart before validation
  ansible.builtin.meta: flush_handlers
  tags:
    - containerd

- name: Validate containerd version
  ansible.builtin.command:
    cmd: containerd --version
  changed_when: false
  failed_when: containerd_version.rc != 0
  register: containerd_version
  tags:
    - containerd

- name: Validate containerd service is active
  ansible.builtin.command:
    cmd: "systemctl is-active {{ containerd_service_name }}"
  changed_when: false
  failed_when: containerd_service_active.rc != 0
  register: containerd_service_active
  tags:
    - containerd
