---
- name: Set validation role facts
  ansible.builtin.set_fact:
    validation_first_control_plane: >-
      {{ groups.get('kube_control_plane', []) | first | default('') }}
    validation_is_first_control_plane: >-
      {{
        inventory_hostname
        == (groups.get('kube_control_plane', []) | first | default(''))
      }}
    validation_lb_wait_retries: >-
      {{
        (validation_loadbalancer_timeout | int / 10)
        | round(0, 'ceil')
        | int
      }}
  tags:
    - validation

- name: Report validation disabled
  ansible.builtin.debug:
    msg: "Cluster validation is disabled; skipping post-install checks."
  changed_when: false
  when: not validation_enabled | bool
  tags:
    - validation

- name: Assert validation prerequisites are defined
  ansible.builtin.assert:
    that:
      - groups.get('kube_control_plane', []) | length > 0
      - kubeconfig_path is defined
      - kubeconfig_path | string | length > 0
      - validation_node_ready_timeout is defined
      - validation_node_ready_timeout | string | length > 0
    fail_msg: >-
      validation requires kube_control_plane, kubeconfig_path, and
      validation_node_ready_timeout.
    success_msg: "Validation prerequisites are defined."
  when: validation_enabled | bool
  tags:
    - validation

- name: Validate Kubernetes nodes
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig {{ kubeconfig_path }} get nodes -o wide"
  changed_when: false
  failed_when: validation_nodes_wide.rc != 0
  register: validation_nodes_wide
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
  tags:
    - validation

- name: Validate all Kubernetes pods
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig {{ kubeconfig_path }} get pods -A"
  changed_when: false
  failed_when: validation_all_pods.rc != 0
  register: validation_all_pods
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
  tags:
    - validation

- name: Check deprecated componentstatuses when available
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig {{ kubeconfig_path }} get componentstatuses"
  changed_when: false
  failed_when: false
  register: validation_componentstatuses
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
  tags:
    - validation

- name: Report componentstatuses check result
  ansible.builtin.debug:
    msg: >-
      componentstatuses check exited with rc={{ validation_componentstatuses.rc }}.
      Output: {{ validation_componentstatuses.stdout
      | default(validation_componentstatuses.stderr, true) }}
  changed_when: false
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_componentstatuses is defined
    - validation_componentstatuses.rc != 0
  tags:
    - validation

- name: Validate kube-system pods
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      -n kube-system get pods
  changed_when: false
  failed_when: validation_kube_system_pods.rc != 0
  register: validation_kube_system_pods
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
  tags:
    - validation

- name: Wait for all nodes to be Ready
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      wait --for=condition=Ready nodes --all
      --timeout={{ validation_node_ready_timeout }}
  changed_when: false
  failed_when: validation_nodes_ready.rc != 0
  register: validation_nodes_ready
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
  tags:
    - validation

- name: Apply Pod Security Admission labels
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      label namespace {{ item }}
      pod-security.kubernetes.io/enforce={{ pod_security_admission_enforce }}
      pod-security.kubernetes.io/audit={{ pod_security_admission_audit }}
      pod-security.kubernetes.io/warn={{ pod_security_admission_warn }}
      pod-security.kubernetes.io/enforce-version={{ pod_security_admission_version }}
      pod-security.kubernetes.io/audit-version={{ pod_security_admission_version }}
      pod-security.kubernetes.io/warn-version={{ pod_security_admission_version }}
      --overwrite
  loop: "{{ pod_security_admission_namespaces }}"
  register: validation_psa_label
  changed_when: "'not labeled' not in validation_psa_label.stdout"
  failed_when: validation_psa_label.rc != 0
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - pod_security_admission_labels_enabled | bool
  tags:
    - validation

- name: Create validation namespace
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      create namespace {{ validation_test_namespace }}
  register: validation_namespace_create
  changed_when: validation_namespace_create.rc == 0
  failed_when:
    - validation_namespace_create.rc != 0
    - "'AlreadyExists' not in validation_namespace_create.stderr"
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
  tags:
    - validation

- name: Apply validation nginx deployment
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl --kubeconfig {{ kubeconfig_path }}
      -n {{ validation_test_namespace }}
      create deployment {{ validation_test_app }}
      --image={{ validation_test_image }}
      --replicas={{ validation_test_replicas }}
      --dry-run=client -o yaml
      | kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
    executable: /bin/bash
  register: validation_deployment_apply
  changed_when: >-
    'created' in validation_deployment_apply.stdout
    or 'configured' in validation_deployment_apply.stdout
  failed_when: validation_deployment_apply.rc != 0
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
  tags:
    - validation

- name: Apply validation ClusterIP service
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl --kubeconfig {{ kubeconfig_path }}
      -n {{ validation_test_namespace }}
      expose deployment {{ validation_test_app }}
      --name={{ validation_clusterip_service_name }}
      --port=80
      --target-port=80
      --type=ClusterIP
      --dry-run=client -o yaml
      | kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
    executable: /bin/bash
  register: validation_clusterip_apply
  changed_when: >-
    'created' in validation_clusterip_apply.stdout
    or 'configured' in validation_clusterip_apply.stdout
  failed_when: validation_clusterip_apply.rc != 0
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
  tags:
    - validation

- name: Wait for validation deployment availability
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      -n {{ validation_test_namespace }}
      rollout status deployment/{{ validation_test_app }}
      --timeout=120s
  changed_when: false
  failed_when: validation_deployment_rollout.rc != 0
  register: validation_deployment_rollout
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
  tags:
    - validation

- name: Apply validation LoadBalancer service when MetalLB is enabled
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl --kubeconfig {{ kubeconfig_path }}
      -n {{ validation_test_namespace }}
      expose deployment {{ validation_test_app }}
      --name={{ validation_loadbalancer_service_name }}
      --port=80
      --target-port=80
      --type=LoadBalancer
      --dry-run=client -o yaml
      | kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
    executable: /bin/bash
  register: validation_loadbalancer_apply
  changed_when: >-
    'created' in validation_loadbalancer_apply.stdout
    or 'configured' in validation_loadbalancer_apply.stdout
  failed_when: validation_loadbalancer_apply.rc != 0
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
    - metallb_enabled | default(false) | bool
  tags:
    - validation

- name: Wait for validation LoadBalancer external IP
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      -n {{ validation_test_namespace }}
      get service {{ validation_loadbalancer_service_name }}
      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  changed_when: false
  register: validation_loadbalancer_ip
  failed_when: validation_loadbalancer_ip.rc != 0
  retries: "{{ validation_lb_wait_retries }}"
  delay: 10
  until: validation_loadbalancer_ip.stdout | length > 0
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
    - metallb_enabled | default(false) | bool
  tags:
    - validation

- name: Report validation LoadBalancer external IP
  ansible.builtin.debug:
    msg: >-
      Validation LoadBalancer external IP:
      {{ validation_loadbalancer_ip.stdout }}
  changed_when: false
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
    - metallb_enabled | default(false) | bool
    - validation_loadbalancer_ip is defined
  tags:
    - validation

- name: Clean up validation namespace
  # Operational risk: this deletes only validation_test_namespace and is gated
  # by validation_create_test_workload plus validation_cleanup_test_workload.
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ kubeconfig_path }}
      delete namespace {{ validation_test_namespace }}
      --ignore-not-found=true
  register: validation_namespace_cleanup
  changed_when: "'deleted' in validation_namespace_cleanup.stdout"
  failed_when: validation_namespace_cleanup.rc != 0
  when:
    - validation_enabled | bool
    - validation_is_first_control_plane | bool
    - validation_create_test_workload | bool
    - validation_cleanup_test_workload | bool
  tags:
    - validation
